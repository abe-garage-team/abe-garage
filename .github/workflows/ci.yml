name: CI & Quality Checks
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: abe_garage_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: abe_garage_test
      AUTH_TOKEN_PEPPER: ci-super-secret-test-pepper-32-chars-long!
      MAIL_ADAPTER: fake
      INITIAL_ADMIN_EMAIL: admin@abegarage.com
      INITIAL_ADMIN_FIRST_NAME: Abe
      INITIAL_ADMIN_LAST_NAME: Admin
      INITIAL_ADMIN_PHONE: '0911000000'
      INITIAL_ADMIN_PASSWORD: Password123!
      GARAGE_NAME: Abe Garage
      GARAGE_ADDRESS: Addis Ababa
      GARAGE_PHONE: '0111234567'
      GARAGE_EMAIL: contact@abegarage.com
      INSTALL_ENABLED: true
      INSTALL_SECRET: ci-setup-secret-test-key-32-chars!
      DATABASE_INTEGRATION: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database schema
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot abe_garage_test < backend/db/schema.sql

      - name: Run database migrations
        run: npm run db:migrate

      - name: Seed the initial Admin
        run: npm run seed:admin

      - name: Run all quality checks
        run: npm run check
